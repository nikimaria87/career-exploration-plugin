<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NextJobber brand support prototype</title><style>*{box-sizing:border-box}body{margin:0;color:#241C24;background:#FBF7F9;font-family:Arial,sans-serif;line-height:1.6}a{color:inherit}button,input,textarea,select{font:inherit}button,a,input,textarea,select{touch-action:manipulation}:focus-visible{outline:3px solid #a95177;outline-offset:4px}header,main,footer{max-width:1200px;margin:auto;padding:32px}.logo{max-width:100%;height:auto}header{display:flex;align-items:center;justify-content:space-between;gap:24px}header a{text-decoration:none}nav{display:flex;gap:24px;align-items:center}.button,button{background:#4C1734;color:white;border:0;border-radius:8px;padding:13px 22px;text-decoration:none;display:inline-block;cursor:pointer}.secondary{background:white;color:#4C1734;border:1px solid #d8cbd1}h1{font-size:clamp(42px,6vw,78px);line-height:1.08;letter-spacing:-2px;font-weight:500}h2{font-size:32px;line-height:1.2;font-weight:500}h3{font-size:21px}.muted,p{color:#766B70}.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase}.hero{padding:56px 0 80px}.hero p{max-width:620px;font-size:21px}.split{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}.split img{max-width:100%;border-radius:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{padding:28px;background:white;border:1px solid #e5dbe0;border-radius:16px}.card a{display:block;margin-top:9px}.card p{font-size:14px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}section{padding:28px 0}label{display:block;font-size:14px;margin:18px 0}input,textarea,select{display:block;width:100%;padding:12px;border:1px solid #cbbdc4;background:white;border-radius:6px;color:#241C24}small{color:#766B70}footer{font-size:13px;border-top:1px solid #e5dbe0;margin-top:40px}.preview{background:white;padding:16px;border:1px solid #e5dbe0}.preview svg{width:100%;height:auto;display:block}.color{display:inline-block;width:90px;height:90px;border-radius:14px;margin-right:14px}.links{max-width:620px;margin:60px auto;text-align:center}.links .button{display:block;margin:16px}.wide{width:100%}@media(max-width:800px){header{display:block}nav{margin-top:20px}.split,.grid{grid-template-columns:1fr}.hero{padding-top:10px}.logo{width:270px}main,header,footer{padding:24px}h1{letter-spacing:-1px}}@media print{nav,button,.noprint{display:none}body{background:white}.card{break-inside:avoid}}</style></head><body><header><img class="logo" src="../logos/nextjobber-wordmark-primary.svg" alt="NextJobber" width="330" height="54"><nav><a href="../START-HERE.html">Brand kit</a></nav></header><main style="max-width:760px"><h1>Brand support</h1><p>This local support-widget prototype answers common brand-kit questions. Messages stay in this page and do not reach a support team.</p><section class="card"><div id="thread" role="log" aria-live="polite"><p>How can I help with the NextJobber kit?</p></div><label>Choose a topic<select id="topic"><option value="logo">Which logo file should I use?</option><option value="edit">How do I edit a template?</option><option value="qr">Where does the QR code go?</option><option value="help">How do I request design support?</option></select></label><button id="ask">Show answer</button></section><p><a href="response-library.md">Open the editable support response library</a></p></main><script>const answers={logo:'Use SVG for editable vector artwork, PNG for images, and the white wordmark on a plum background. Use the NJ icon at small sizes.',edit:'Open the design studio for a poster export. Edit SVG text in a vector editor, DOCX in Word, and PPTX in PowerPoint. Font files are included.',qr:'The QR opens the existing private dashboard. Review its destination and access before sharing or printing it.',help:'This prototype has no live team connected. Add your chosen support address or helpdesk integration
