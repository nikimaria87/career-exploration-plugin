<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NextJobber brand studio</title><style>*{box-sizing:border-box}body{margin:0;color:#241C24;background:#FBF7F9;font-family:Arial,sans-serif;line-height:1.6}a{color:inherit}button,input,textarea,select{font:inherit}button,a,input,textarea,select{touch-action:manipulation}:focus-visible{outline:3px solid #a95177;outline-offset:4px}header,main,footer{max-width:1200px;margin:auto;padding:32px}.logo{max-width:100%;height:auto}header{display:flex;align-items:center;justify-content:space-between;gap:24px}header a{text-decoration:none}nav{display:flex;gap:24px;align-items:center}.button,button{background:#4C1734;color:white;border:0;border-radius:8px;padding:13px 22px;text-decoration:none;display:inline-block;cursor:pointer}.secondary{background:white;color:#4C1734;border:1px solid #d8cbd1}h1{font-size:clamp(42px,6vw,78px);line-height:1.08;letter-spacing:-2px;font-weight:500}h2{font-size:32px;line-height:1.2;font-weight:500}h3{font-size:21px}.muted,p{color:#766B70}.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase}.hero{padding:56px 0 80px}.hero p{max-width:620px;font-size:21px}.split{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}.split img{max-width:100%;border-radius:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{padding:28px;background:white;border:1px solid #e5dbe0;border-radius:16px}.card a{display:block;margin-top:9px}.card p{font-size:14px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}section{padding:28px 0}label{display:block;font-size:14px;margin:18px 0}input,textarea,select{display:block;width:100%;padding:12px;border:1px solid #cbbdc4;background:white;border-radius:6px;color:#241C24}small{color:#766B70}footer{font-size:13px;border-top:1px solid #e5dbe0;margin-top:40px}.preview{background:white;padding:16px;border:1px solid #e5dbe0}.preview svg{width:100%;height:auto;display:block}.color{display:inline-block;width:90px;height:90px;border-radius:14px;margin-right:14px}.links{max-width:620px;margin:60px auto;text-align:center}.links .button{display:block;margin:16px}.wide{width:100%}@media(max-width:800px){header{display:block}nav{margin-top:20px}.split,.grid{grid-template-columns:1fr}.hero{padding-top:10px}.logo{width:270px}main,header,footer{padding:24px}h1{letter-spacing:-1px}}@media print{nav,button,.noprint{display:none}body{background:white}.card{break-inside:avoid}}</style></head><body><header><img class="logo" src="../logos/nextjobber-wordmark-primary.svg" alt="NextJobber" width="330" height="54"><nav><a href="../START-HERE.html">All assets</a></nav></header><main><h1>Make it yours.</h1><p>Edit a poster, save brand settings, and export your design.</p><div class="split" style="align-items:start"><section><h2>Brandkit settings</h2><label>Primary color<input type="color" id="color" value="#4C1734"></label><label>Secondary color<input type="color" id="secondary" value="#766B70"></label><button id="settings">Download settings JSON</button><h2>Design tool</h2><label>Headline, one line per row<textarea id="headline" rows="3">Your next
career step,
with a plan.</textarea></label><label>Supporting line<input id="subline" value="Explore what fits. Build the evidence."></label><label>Canvas<select id="format"><option value="1080,1080">Square post · 1080 × 1080</option><option value="1080,1350">Portrait post · 1080 × 1350</option><option value="1080,1920">Story · 1080 × 1920</option></select></label><label>Background<select id="theme"><option value="light">Paper</option><option value="dark">Plum</option></select></label><div class="row"><button id="svg">Download SVG</button><button id="png" class="secondary">Download PNG</button></div><p id="status" role="status"></p></section><section><h2>Preview</h2><div class="preview" id="preview"></div><p><small>Your edits stay in this page until you export them. No upload is needed.</small></p></section></div></main><script>const master="<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"1600\" height=\"260\" viewBox=\"0 0 1600 260\" role=\"img\" aria-label=\"NextJobber brand artwork\"><g transform=\"translate(80 48) scale(1.6744186046511629)\" fill=\"none\" stroke-width=\"6.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 100V4L72 100V4\" transform=\"translate(0 0)\" stroke=\"#4C1734\"/><path d=\"M60 4H4V100H60 M4 51H52\" transform=\"translate(94 0)\" stroke=\"#4C1734\"/><path d=\"M4 4L72 100 M72 4L4 100\" transform=\"translate(176 0)\" stroke=\"#4C1734\"/><path d=\"M2 4H66 M34 4V100\" transform=\"translate(270 0)\" stroke=\"#4C1734\"/><path d=\"M2 4H58V72Q58 100 31 100Q12 100 4 86\" transform=\"translate(356 0)\" stroke=\"#766B70\"/><path d=\"M40 3C17 3 3 23 3 52S17 101 40 101S77 81 77 52S63 3 40 3Z\" transform=\"translate(436 0)\" stroke=\"#766B70\"/><path d=\"M4 4V100H36Q65 100 65 76Q65 52 35 52H4 M4 4H34Q61 4 61 28Q61 52 35 52\" transform=\"translate(534 0)\" stroke=\"#766B70\"/><path d=\"M4 4V100H36Q65 100 65 76Q65 52 35 52H4 M4 4H34Q61 4 61 28Q61 52 35 52\" transform=\"translate(621 0)\" stroke=\"#766B70\"/><path d=\"M60 4H4V100H60 M4 51H52\" transform=\"translate(708 0)\" stroke=\"#766B70\"/><path d=\"M4 100V4H34Q64 4 64 29Q64 54 34 54H4 M34 54L67 100\" transform=\"translate(790 0)\" stroke=\"#766B70\"/></g></svg>";const initial={"name": "NextJobber", "version": "1.0.0", "tagline": "Your next career step, with a plan.", "colors": {"plum": "#4C1734", "warmGray": "#766B70", "ink": "#241C24", "rose": "#E3B4C6", "paper": "#FBF7F9", "white": "#FFFFFF"}, "typography": {"body": "DejaVu Sans", "heading": "DejaVu Sans Bold", "logo": "Original outlined geometric lettering; no font installation required"}, "spacing": {"unit": 8, "logoClearSpace": "At least half the capital-letter height on every side", "minimumWordmarkWidthPx": 180, "minimumSymbolWidthPx": 24}, "links": {"dashboard": "https://career-compass-explore-1022.fizzy-camel-0518.chatgpt.site", "plugin": "https://chatgpt.com/plugins/plugin_asdk_app_sites_3c1684dd4fb48191b2ae177ea06727a3"}, "accessNote": "Current dashboard requires the owner account. Review access before public campaigns."};const el=id=>document.getElementById(id);const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));function make(){const[w,h]=el('format').value.split(',').map(Number);const dark=el('theme').value==='dark';const p=el('color').value,g=el('secondary').value;const bg=dark?p:'#FBF7F9',fg=dark?'#FFFFFF':p;let y=h>1500?380:280;let lines=el('headline').value.split('\n').slice(0,5);let parts=lines.map(s=>{const line=`<text x="72" y="${y}" font-family="Arial,sans-serif" font-size="82" font-weight="700" fill="${fg}">${esc(s.slice(0,23))}</text>`;y+=110;return line}).join('');let logo=master.replace(/<svg[^>]*>/,'').replace('</svg>','').replaceAll('#4C1734',fg).replaceAll('#766B70',dark?'#E3B4C6':g);return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><rect width="${w}" height="${h}" fill="${bg}"/>${parts}<text x="76" y="${y+35}" font-family="Arial,sans-serif" font-size="25" fill="${dark?'#E3B4C6':g}">${esc(el('subline').value.slice(0,68))}</text><g transform="translate(25 ${h-145}) scale(.62)">${logo}</g></svg>`}function update(){el('preview').innerHTML=make()}function save(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);el('status').textContent='Your download is ready.'}for(const id of['color','secondary','headline','subline','format','theme'])el(id).addEventListener('input',update);el('svg').onclick=()=>save(new Blob([make()],{type:'image/svg+xml'}),'nextjobber-design.svg');el('settings').onclick=()=>{const d=structuredClone(initial);d.colors.plum=el('color').value;d.colors.warmGray=el('secondary').value;save(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),'nextjobber-brand-settings.json')};el('png').onclick=async()=>{const image=new Image();const uri=URL.createObjectURL(new Blob([make()],{type:'image/svg+xml'}));image.onload=()=>{const c=document.createElement('canvas');c.width=image.width;c.height=image.height;c.getContext('2d').drawImage(image,0,0);c.toBlob(b=>save(b,'nextjobber-design.png'));URL.revokeObjectURL(uri)};image.onerror=()=>{el('status').textContent='PNG export could not load. Download the SVG instead.';URL.revokeObjectURL(uri)};image.src=uri};update();</script></body></html>
